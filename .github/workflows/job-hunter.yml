name: Job Hunter Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "resume_engine.py"
      - "profile.json"
      - "config.yaml"
      - "requirements.txt"
      - ".github/workflows/job-hunter.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: job-hunter-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile main.py resume_engine.py
      - name: Scan, alert, and process resume requests
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}
        run: python main.py
      - name: Persist bot state
        if: always()
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen_jobs.json data/jobs.json data/telegram_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update job hunter state [skip ci]"
          git push
